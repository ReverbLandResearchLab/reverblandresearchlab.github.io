<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="author" content="{{ site.author }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/assets/img/portfolio/industrial.jpg">
    <meta property="og:locale" content="en_GB">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ site.url }}/assets/img/portfolio/industrial.jpg">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "{{ site.url }}/#business",
          "name": "{{ site.title }}",
          "url": "{{ site.url }}/",
          "email": "mailto:{{ site.email }}",
          "description": "{{ site.description }}",
          "founder": {"@id": "{{ site.url }}/#daniel-gorny"},
          "areaServed": "Worldwide",
          "serviceType": ["Legacy system modernization", "ERP and MES integration", "Python backend engineering", "Industrial IoT and edge systems", "Applied AI automation"]
        },
        {
          "@type": "Person",
          "@id": "{{ site.url }}/#daniel-gorny",
          "name": "Daniel Górny",
          "url": "{{ site.url }}/",
          "jobTitle": "Senior Software and Systems Engineer",
          "worksFor": {"@id": "{{ site.url }}/#business"},
          "knowsAbout": ["Python", "SQL", "ERP", "MES", "Legacy system modernization", "Database integration", "Industrial automation", "IoT", "Applied AI"]
        },
        {
          "@type": "WebSite",
          "@id": "{{ site.url }}/#website",
          "url": "{{ site.url }}/",
          "name": "{{ site.title }}",
          "publisher": {"@id": "{{ site.url }}/#business"},
          "inLanguage": "en-GB"
        }
      ]
    }
    </script>
  </head>
  <body class="page-body">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="ReverbLand Research Lab home"><span class="brand-mark">RL</span><span>ReverbLand<span class="brand-muted"> / R.LAB</span></span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#services">Services</a><a href="{{ '/' | relative_url }}#work">Selected work</a><a href="{{ '/' | relative_url }}#approach">Approach</a><a class="nav-cta" href="mailto:{{ site.email }}">Start a conversation</a>
      </nav>
    </header>
    <main class="page-content">{{ content }}</main>
    <footer class="site-footer"><span>ReverbLand Research Lab</span><span>Python · ERP/MES · databases · industrial systems</span><a href="mailto:{{ site.email }}">{{ site.email }}</a></footer>
  </body>
</html>
